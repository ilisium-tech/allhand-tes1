plugins {
    id 'com.android.application' version '8.3.0' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
    // ❌ HAPUS: id 'dev.flutter.flutter-gradle-plugin' version '1.0.0' apply false
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Custom build directory (optional)
def newBuildDir = rootProject.layout.buildDirectory.dir("../../build").get().asFile
rootProject.buildDir = newBuildDir

subprojects {
    buildDir = new File(rootProject.buildDir, name)
    evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
